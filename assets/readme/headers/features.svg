<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%">
  <title>Features section header</title>
  <defs>
    <linearGradient id="bg-features" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="80" fill="url(#bg-features)"/>

  <!-- Bottom border -->
  <rect x="0" y="78" width="1200" height="2" fill="#06B6D4" opacity="0.3"/>

  <!-- Emoji -->
  <text x="40" y="50" font-family="system-ui, sans-serif" font-size="36">✨</text>

  <!-- Title -->
  <text x="90" y="52" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#1E293B">
    Features
  </text>
</svg>
